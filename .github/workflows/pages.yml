name: Deploy solo preview (GitHub Pages)

# Static build where the World runs in the browser (no server needed).
# One-time: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build solo client
        run: pnpm --filter @tudobem/client build
        env:
          VITE_LOCAL_WORLD: '1'
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Solo e2e against the Pages build
        run: |
          node scripts/serve-static.mjs apps/client/dist 4173 /${{ github.event.repository.name }}/ &
          sleep 1
          SOLO=1 BASE_URL=http://localhost:4173/${{ github.event.repository.name }}/ CHROME_PATH=$(which google-chrome || which chromium) pnpm e2e
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
