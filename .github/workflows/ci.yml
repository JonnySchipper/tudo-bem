name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Browser e2e (full Phase 0 play path)
        run: |
          DATA_DIR=$(mktemp -d) pnpm start &
          for i in $(seq 1 30); do curl -sf localhost:8787/healthz && break; sleep 1; done
          CHROME_PATH=$(which google-chrome || which chromium) pnpm e2e
