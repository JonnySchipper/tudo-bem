name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Browser e2e (play path + recado, feira day/night, night NPCs, Me vê um across restarts)
        # e2e:all starts its own server with a pinned game clock (TB_TEST_CLOCK_CONTROL, TB_TEST_OFFER, TB_TEST_ROLL), so the result
        # does not depend on the time of day the job runs. e2e:meveum brings its own pinned server.
        run: CHROME_PATH=$(which google-chrome || which chromium) pnpm e2e:all
