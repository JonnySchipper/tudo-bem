# fly launch --no-deploy --copy-config  (then)  fly volumes create tudobem_data --size 1  &&  fly deploy
app = "tudo-bem"
primary_region = "iad"
# SIGINT (Fly's default kill_signal) starts the graceful close in apps/server/src/index.ts: write the stores,
# close sockets with 1012, back up. The server gives itself 25 s; Fly waits this long before SIGKILL.
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/data"
  ROOM_CAP = "16"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[mounts]
  source = "tudobem_data"
  destination = "/data"
  # Fly takes a daily volume snapshot; keep two weeks of them (restore steps: docs/SQLITE.md).
  snapshot_retention = 14

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
