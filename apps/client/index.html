<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Tudo Bem — um bairro brasileiro para aprender português. A Brazilian neighborhood where you hang out and learn Portuguese." />
    <meta name="theme-color" content="#e5572f" />
    <title>Tudo Bem · Praça Central</title>
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:ital,wght@0,500;0,700;0,800;1,500;1,600&family=Jersey+10&display=swap" rel="stylesheet" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tudo Bem" />
    <meta property="og:title" content="Tudo Bem · Vila Ipê" />
    <meta property="og:description" content="Um bairro brasileiro para aprender português. A Brazilian neighborhood where you hang out and learn Portuguese." />
    <meta property="og:url" content="https://playtudobem.com/" />
    <meta property="og:image" content="https://playtudobem.com/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tudo Bem" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tudo Bem · Vila Ipê" />
    <meta name="twitter:description" content="Um bairro brasileiro para aprender português. A Brazilian neighborhood where you hang out and learn Portuguese." />
    <meta name="twitter:image" content="https://playtudobem.com/brand/og-image.png" />
    <!-- First paint before the app bundle arrives: the page colour and a CSS-only "Carregando…" that main.ts removes. -->
    <style>
      html, body { margin: 0; background: #2a2233; }
      #ui > #boot-loading { position: fixed; inset: 0; z-index: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #f5e6d3; font: 700 17px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; pointer-events: none; }
      #boot-loading .boot-en { font-weight: 500; font-size: 14px; opacity: 0.75; }
      #boot-loading .dots { display: flex; gap: 8px; }
      #boot-loading .dots i { width: 10px; height: 10px; border-radius: 50%; background: #e5a13a; animation: boot-bob 1s ease-in-out infinite; }
      #boot-loading .dots i:nth-child(2) { animation-delay: 0.15s; }
      #boot-loading .dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes boot-bob { 0%, 100% { transform: translateY(0); opacity: 0.5; } 50% { transform: translateY(-6px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot-loading .dots i { animation: none; opacity: 0.8; } }
      .boot-noscript { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: #2a2233; color: #f5e6d3; font: 600 18px/1.4 system-ui, sans-serif; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="world" aria-label="Mundo do Tudo Bem (Tudo Bem world)"></canvas>
    <div id="ui">
      <div id="boot-loading" role="status" aria-live="polite">
        <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <div>Carregando…<div class="boot-en">Loading…</div></div>
      </div>
    </div>
    <noscript>
      <div class="boot-noscript">
        <p>O Tudo Bem precisa de JavaScript. Ative o JavaScript no navegador e recarregue a página.</p>
        <p style="font-weight: 500; font-size: 15px; opacity: 0.8">Tudo Bem needs JavaScript. Turn it on in your browser and reload the page.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
